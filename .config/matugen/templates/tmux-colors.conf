# Generated by matugen — do not edit manually
# Palette variables consumed by the powerline status-line in ~/.tmux.conf

set -g @thm_bg                    "{{ colors.background.default.hex }}"
set -g @thm_fg                    "{{ colors.on_surface.default.hex }}"

set -g @thm_surface               "{{ colors.surface.default.hex }}"
set -g @thm_surface_container     "{{ colors.surface_container.default.hex }}"
set -g @thm_surface_container_high "{{ colors.surface_container_high.default.hex }}"
set -g @thm_outline               "{{ colors.outline.default.hex }}"
set -g @thm_outline_variant       "{{ colors.outline_variant.default.hex }}"
set -g @thm_on_surface_variant    "{{ colors.on_surface_variant.default.hex }}"

set -g @thm_primary               "{{ colors.primary.default.hex }}"
set -g @thm_on_primary            "{{ colors.on_primary.default.hex }}"
set -g @thm_primary_container     "{{ colors.primary_container.default.hex }}"
set -g @thm_on_primary_container  "{{ colors.on_primary_container.default.hex }}"

set -g @thm_secondary             "{{ colors.secondary.default.hex }}"
set -g @thm_on_secondary          "{{ colors.on_secondary.default.hex }}"
set -g @thm_secondary_container   "{{ colors.secondary_container.default.hex }}"
set -g @thm_on_secondary_container "{{ colors.on_secondary_container.default.hex }}"

set -g @thm_tertiary              "{{ colors.tertiary.default.hex }}"
set -g @thm_on_tertiary           "{{ colors.on_tertiary.default.hex }}"
set -g @thm_tertiary_container    "{{ colors.tertiary_container.default.hex }}"
set -g @thm_on_tertiary_container "{{ colors.on_tertiary_container.default.hex }}"

set -g @thm_error                 "{{ colors.error.default.hex }}"
set -g @thm_on_error              "{{ colors.on_error.default.hex }}"

# Non-powerline chrome, styled directly (no need to reference these elsewhere)
set -g pane-border-style             "fg={{ colors.outline_variant.default.hex }}"
set -g pane-active-border-style      "fg={{ colors.outline_variant.default.hex }}"
set -g message-style                 "fg={{ colors.on_primary_container.default.hex }},bg={{ colors.primary_container.default.hex }}"
set -g message-command-style         "fg={{ colors.on_surface_variant.default.hex }},bg={{ colors.surface_container_high.default.hex }}"
set -g mode-style                    "fg={{ colors.on_primary.default.hex }},bg={{ colors.primary.default.hex }}"
set -g copy-mode-match-style         "fg={{ colors.on_primary_container.default.hex }},bg={{ colors.primary_container.default.hex }}"
set -g copy-mode-current-match-style "fg={{ colors.on_tertiary_container.default.hex }},bg={{ colors.tertiary_container.default.hex }}"
