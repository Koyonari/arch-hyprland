# Lock before suspend using the same script as Super+L. Started from config/autostart.lua.
general {
    lock_cmd = ~/.config/hypr/scripts/hyprlock.sh   # same lock as Super+L
    before_sleep_cmd = loginctl lock-session        # lock before suspend
    after_sleep_cmd = hyprctl dispatch dpms on      # avoid pressing a key twice to wake the display
    inhibit_sleep = 3                               # hold off suspend until the session is actually locked
}
