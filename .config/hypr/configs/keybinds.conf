###################
### KEYBINDINGS ###
###################

# CachyOS lua config (config/keybinds.lua) handles: window close/focus/move,
# terminal, file manager (dolphin), browser (firefox), fullscreen, togglesplit,
# workspace switching, workspace number binds, and mouse move/resize.
# This file only adds what the lua config doesn't cover, with no duplicate keys.

$mainMod = SUPER

# --- App launchers ---
bind = $mainMod SHIFT, Return, exec, [float; size 800 550] $terminal   # floating kitty
bind = $mainMod SHIFT, D,      exec, $menu                             # Rofi (Super+D = fullscreen in lua)
bind = $mainMod SHIFT, E,      exec, kitty yazi                        # Yazi terminal file manager
bind = $mainMod, L,            exec, ~/.config/hypr/scripts/hyprlock.sh
bind = $mainMod, B,            exec, flatpak run app.zen_browser.zen

# --- Waybar controls ---
bind = $mainMod, H,       exec, pkill -SIGUSR1 waybar
bind = $mainMod SHIFT, R, exec, ~/.config/hypr/scripts/wbrestart.sh
bind = $mainMod CTRL,  B, exec, ~/.config/hypr/scripts/WaybarStyles.sh
bind = $mainMod ALT,   B, exec, ~/.config/hypr/scripts/WaybarLayout.sh

# --- Wallpaper / color scheme ---
bind = $mainMod SHIFT, W, exec, ~/.config/hypr/scripts/wppicker.sh    # Super+W = browser in lua

# --- Utilities ---
bind = $mainMod SHIFT, P, exec, ~/.config/hypr/scripts/screenshot.sh  # Super+Shift+S = special WS in lua
bind = $mainMod SHIFT, C, exec, hyprpicker -a                          # Super+C = calculator in lua
bind = $mainMod SHIFT, Q, exec, ~/.config/hypr/scripts/KillActiveProcess.sh

# --- Window management ---
bind  = $mainMod SHIFT, Space, togglefloating                          # Super+Space = launcher in lua
bind  = $mainMod SHIFT, F,     fullscreen
bind  = CTRL ALT, Delete,      exec, hyprctl dispatch exit 0

# Resize (Super+Shift+arrows = move window in lua; Super+Alt+arrows for resize)
binde = $mainMod ALT, left,  resizeactive,-50 0
binde = $mainMod ALT, right, resizeactive,50 0
binde = $mainMod ALT, up,    resizeactive,0 -50
binde = $mainMod ALT, down,  resizeactive,0 50

# --- Hardware keys ---
# Lua routes these through noctalia IPC (won't work without noctalia shell).
# These run alongside; noctalia calls fail silently and scripts take effect.
bindel = ,XF86AudioRaiseVolume,  exec, ~/.config/hypr/scripts/volume.sh --inc
bindel = ,XF86AudioLowerVolume,  exec, ~/.config/hypr/scripts/volume.sh --dec
bindel = ,XF86AudioMute,         exec, ~/.config/hypr/scripts/volume.sh --toggle
bindel = ,XF86AudioMicMute,      exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp,   exec, ~/.config/hypr/scripts/brightness.sh --inc
bindel = ,XF86MonBrightnessDown, exec, ~/.config/hypr/scripts/brightness.sh --dec
bindl  = ,XF86AudioNext,         exec, playerctl next
bindl  = ,XF86AudioPause,        exec, playerctl play-pause
bindl  = ,XF86AudioPlay,         exec, playerctl play-pause
bindl  = ,XF86AudioPrev,         exec, playerctl previous
