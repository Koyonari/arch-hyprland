# Prefix
set -g prefix C-b
bind C-b send-prefix

# Terminal
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Mouse
set -g mouse on

# Start windows and panes at 1
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Split panes with | and -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Reload config
bind r source-file ~/.tmux.conf \; display "Reloaded!"

# Reduce escape time for neovim
set -sg escape-time 0
set -g focus-events on

# Transparent background (inherits kitty opacity)
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*:Tc"

# Matugen colors (regenerated on wallpaper change)
if-shell "[ -f ~/.config/tmux/matugen-colors.conf ]" \
  "source ~/.config/tmux/matugen-colors.conf"

# ── Powerline-style status bar (colors from matugen-colors.conf) ──────────
set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-justify left
set -g status-left-length 40
set -g status-right-length 60
set -g status-style "fg=#{@thm_fg},bg=default"

# All styling below is done inline via #[...] codes in the format strings,
# so these separate style options must stay cleared (older matugen templates
# used to set them directly, and tmux never unsets an option just because a
# later source-file omits it — a stale value here silently overrides format
# strings that follow).
set -g status-left-style "default"
set -g status-right-style "default"
set -g window-status-style "default"
set -g window-status-current-style "default"

# Session pill — flips to a "WAIT" pill while the prefix key is held
# (swap the  /  glyphs below if the rounded caps render backwards in your font)
set -g status-left "#[fg=#{@thm_primary},bg=default]#[fg=#{@thm_on_primary},bg=#{@thm_primary},bold] #{?client_prefix,󰌌 WAIT,󰆍 #S} #[fg=#{@thm_primary},bg=default]#[fg=default,bg=default]"

# Window list — plain text when inactive, filled pill for the active window
set -g window-status-separator ""
set -g window-status-format "#[fg=#{@thm_primary}] #I #W#{?window_bell_flag,󰂞,}#{?window_activity_flag,󰖸,} "
set -g window-status-current-format "#[fg=#{@thm_primary},bg=default]#[fg=#262626,bg=#{@thm_primary},bold] #I #W#{?window_zoomed_flag,󰊓,} #[fg=#{@thm_primary},bg=default]#[fg=default,bg=default]"

# Host / date / time, right-aligned
set -g status-right "#[fg=#{@thm_primary}] 󰌽 #h  #[fg=#{@thm_primary_container}]│#[fg=#{@thm_primary}]  %d %b #[fg=#{@thm_primary_container}]│#[fg=#{@thm_primary},bold]  %H:%M "

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

run '~/.tmux/plugins/tpm/tpm'
